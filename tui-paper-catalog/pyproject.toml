[project]
name = "tui-paper-catalog"
version = "0.1.0"
description = "Terminal UI for browsing research PDFs by title, not filename"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
    "pypdf>=6.14.2",
    "httpx>=0.28.1",
]

[project.scripts]
paper-catalog = "paper_catalog.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_catalog"]
